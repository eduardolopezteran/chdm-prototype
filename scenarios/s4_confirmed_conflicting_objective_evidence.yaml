    evidence_id: E-VAL-A
    basis: MEASURED_OPERATIONAL_EVIDENCE
    supports: ACHIEVED
  - signal_id: E-VAL-B
    evidence_id: E-VAL-B
    basis: MEASURED_OPERATIONAL_EVIDENCE
    supports: NOT_ACHIEVED

