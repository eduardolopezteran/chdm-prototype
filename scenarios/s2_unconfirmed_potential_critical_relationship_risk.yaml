# CHDM v0.1 Scenario Lab — S2
# Deliberately paired with S1: byte-for-byte identical
# dimension_qualifier_signals and risk_severity_claims entries, and
# identical value_evidence_signals. The ONLY difference from S1 is the
# `evidence:` block's declared evidence_state for E-CHAMPION-1
# (Confirmed -> Unverified) — a single authoritative field, since both the
# D6 qualifier signal and the CR-01 claim derive their evidence_state from
# that one entry rather than declaring their own (Checkpoint 3
# correction). See tests/test_scenarios.py::
# test_s1_s2_differ_at_exactly_one_authoritative_evidence_field for the
# programmatic structural-diff verification.

scenario_id: S2
title: "Unconfirmed (potential) critical relationship risk — otherwise identical to S1"
account_description: >
  Same fictional account and same objective/adoption evidence as S1.
  The only change: the champion-departure report has NOT been confirmed
  (Current + Unverified) rather than confirmed. Per the §3.3 confirmation
  boundary, unconfirmed evidence may establish potential severity but must
  never activate it. This scenario demonstrates that the same underlying
  fact, differing only in confirmation status, produces a materially
  different governed Operational Priority and Evidence Review outcome —
  and that the resulting DMEG is correctly recognized as
  priority-elevating (Checkpoint 2 refinement).

lifecycle: L3
not_yet_expected: false

objective:
  objective_id: OBJ-1
  text: "Reduce monthly reconciliation effort by 50%"
  is_known: true

dimensions_to_evaluate: [D1, D2, D6]

evidence:
  - evidence_id: E-VAL-1
    evidence_state: CURRENT_CONFIRMED
  - evidence_id: E-ADOPT-1
    evidence_state: CURRENT_CONFIRMED
  - evidence_id: E-CHAMPION-1
    evidence_state: CURRENT_UNVERIFIED   # <- the one authoritative difference from S1

value_evidence_signals:
  - signal_id: E-VAL-1
    evidence_id: E-VAL-1
    basis: MEASURED_OPERATIONAL_EVIDENCE
    supports: ACHIEVED

dimension_qualifier_signals:
  - signal_id: E-D2-1
    dimension: D2
    evidence_id: E-ADOPT-1
    qualifier: INTENDED_WORKFLOWS_OPERATING_NORMALLY
  - signal_id: E-D6-1
    dimension: D6
    evidence_id: E-CHAMPION-1
    qualifier: CHAMPION_LOST_NO_SUCCESSOR

risk_severity_claims:
  - signal_id: E-RISK-1
    mechanism: CR-01
    evidence_id: E-CHAMPION-1
    tier: CRITICAL

expected:
  objective_outcome_state: ACHIEVED
  dimension_states:
    D1: SUPPORTED
    D2: SUPPORTED
    D6: INSUFFICIENT_EVIDENCE
  dimension_reliability: {}
  risk_records:
    CR-01: {potential_severity: CRITICAL, activated_severity: null}
  dmeg_count: 1
  dmeg_affects_operational_priority: true
  reliability_level: LOW
  operational_priority: OPU
  evidence_review: ER1
