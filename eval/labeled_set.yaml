  - id: "40_d6_qualifier_champion_lost_vs_departure_unconfirmed"
    description: >
      Milestone 4B D6 qualifier coverage cases 2-3 of 4, combined into
      one case deliberately: the trickiest pair to distinguish, flagged
      explicitly during Milestone 4B architecture negotiation.
      CHAMPION_DEPARTURE_UNCONFIRMED is for a genuine, unresolved signal
      that does NOT clearly confirm an actual departure (Tom Reyes,
      below) -- correct behavior must never collapse an unresolved signal
      into a confirmed-departure qualifier just because a departure is
      plausible. NORMALIZED (D6 EXPLICIT-basis composition gate
      extension, benchmark audit; same principle previously applied to
      Case 35): this case's Priya Nair facts -- confirmed departure, and
      no successor/continuing coverage -- are stated in one semicolon-
      joined clause of the source sentence, but a live D6-focused gate
      probe (prompt_v4_4b_dimqual_v3_2_d6_explicit_gate_probe1) confirmed
      stage-1 legitimately and consistently extracts these as TWO
      separate StakeholderObservations under the frozen isolated one-
      observation-per-call architecture. Each individual predicate is
      correctly grounded and EXPLICIT, but because they resolve to two
      different observations, no single observation's predicate set is
      complete, so CHAMPION_LOST_NO_SUCCESSOR correctly does not compose
      -- this is the frozen one-observation rule doing its job, not an
      EXPLICIT-basis gate failure or a defect. This benchmark previously
      expected composition from a single combined observation span -- an
      expectation authored before stage-1's actual per-clause splitting
      behavior on this sentence was verified live, which became
