# Build Milestone 2 — synthetic, hand-labeled extraction evaluation set
# (spec §14). All account notes below are entirely synthetic/deidentified
# — no real customer data. Each case specifies the source text, the
# observations a correct extraction should find, the required
# explicit/inferred classification, one or more acceptable exact
# source-span substrings for each expected observation, and facts that
# must NOT be extracted. This file is pure data — eval/metrics.py scores
# a live provider's output against it; nothing here is executed.
#
# Milestone 2B.1 revision note: this file was re-annotated (evaluation-
# only change; no extraction code touched) to fix an under-labeling
# problem discovered comparing baseline_v1.json against
# baseline_v1_fix1.json — many real, grounded, Customer-Health-relevant
# facts the live model correctly extracted had no labeled expectation at
# all, so they were being scored as "unsupported" even though they were
# fully grounded. Changes in this revision:
#   - every expected_observations entry now carries `role`
#     (primary | supporting | optional-valid) instead of being treated as
#     uniformly required;
#   - `span_substring` (singular) is now `span_substrings` (a list) so a
#     label can accept more than one semantically-equivalent exact span
#     boundary (e.g. with/without a leading article) without introducing
#     any fuzzy matching in the extraction pipeline itself — grounding
#     stays byte-exact; only the evaluator's benchmark-matching step
#     tolerates boundary variants (Milestone 2B.1 spec §7/§8);
#   - a new `grounded_but_irrelevant_permitted` list (case 14 only) marks
#     content that IS correctly grounded but is not Customer-Health
#     relevant, so it scores as IRRELEVANT_BUT_GROUNDED rather than being
#     silently rewarded or wrongly penalized as unsupported;
#   - case 12's "b" side now carries `alternate_types` +
#     `ontology_ambiguity: true` — an explicit, reviewed evaluation
#     accommodation (not a new canonical extraction rule; see
#     eval/metrics.py docstring and the Milestone 2B.1 checkpoint report);
#   - case 05 was deliberately NOT given an alternate type: its usage-
#     growth fact stays canonically ADOPTION_OBSERVATION only, so a model
#     emitting OBJECTIVE_CANDIDATE for it scores WRONG_TYPE, per the
#     explicit Milestone 2B.1 Case 05 disposition;
#   - cases 16-20 are new, small, deliberate additions targeting known
#     classification boundaries (objective evidence strength, adoption vs.
#     value, a second contradiction example) — the original 15 cases and
#     their source texts are otherwise unchanged.
# baseline_v1.json and baseline_v1_fix1.json (scored against the PRIOR
# single-span, all-required version of this file) are historical
# artifacts and are not affected by this revision.
#
# Milestone 2B.2 revision note (OC-01 ontology clarification, approved):
# three authorized corrections plus three new minimal validation cases.
# baseline_v1_fix1_eval2.json (scored against the PRIOR 20-case version
# of this file) is a historical artifact and is not affected.
#   - case 12's "b" side: the ontology_ambiguity/alternate_types
#     accommodation is retired. Under OC-01/OC-02, "Average close time
#     remains unchanged from baseline" is an observed operational metric,
#     not a stated desired outcome -- canonical type is now
#     ADOPTION_OBSERVATION only, consistent with the Case 05 disposition;
#   - case 20's "a" side: relabeled from OBJECTIVE_CANDIDATE to
#     STRATEGIC_OBSERVATION under OC-03. "Implementation was completed
#     ahead of schedule" never states a desired future outcome -- this
#     was a labeling error in the original Milestone 2B.1 benchmark, not
#     just a model deficiency, corrected here;
#   - case 17: relabeled from OBJECTIVE_CANDIDATE to STRATEGIC_OBSERVATION
#     under OC-03 (approved "Case 17 disposition," reviewed and confirmed
#     separately from the initial two corrections above). "Completed
#     phase 1 of the rollout on schedule; phase 2 configuration begins
#     next week" describes rollout/project status and milestone
#     progression, not a stated desired customer outcome;
#   - cases 21-23 are new, small, targeted additions probing the OC-01
#     boundary directly: an inferred-but-not-explicit objective distinct
#     from case 16's scenario (21), a pure strategic/project-status fact
#     with no usage language (22), and a pure adoption/milestone fact
#     with no goal language (23) -- specifically targeting the
#     milestone-completion exclusion named in OC-01.
#
# Milestone 2C revision note (Candidate CHDM Classification Extraction,
# approved checkpoint): 10 new cases (24-33) exercising
# candidate_risk_signals / candidate_evidence_classifications. Cases
# 01-23 and their source texts are entirely unchanged. Two new optional
# per-case fields:
#   - `expected_candidate_risk_signals`: each entry has `mechanism`
#     (CR-01/02/08 -- CR-03 deferred from AI-automated classification per
#     the PMO Option B decision; it remains fully governed deterministically,
#     see registry/risk_mechanisms.yaml), `proposed_severity_tier` (WATCH/MATERIAL/
#     CRITICAL), `role`, `span_substrings` (the classification's OWN
#     grounding span), and `supporting_observation_span_substrings`
#     (identifies WHICH expected_observations entry this classification
#     must reference, by span match -- mirrors how case 12/20's
#     `source: a`/`source: b` disambiguate which side a fact belongs to);
#   - `expected_candidate_evidence_classifications`: same shape, with
#     `proposed_basis` (PROXY_SUPPORTED/MEASURED_OPERATIONAL_EVIDENCE/
#     CUSTOMER_CONFIRMED/INDEPENDENTLY_VERIFIED) and `supports`
#     (ACHIEVED/PROGRESSING/NOT_ACHIEVED) in place of mechanism/tier.
# Case 32 exercises the negative path directly (both lists explicitly
# empty -- correct behavior is proposing nothing), mirroring case 14's
# "empty is the correct primary result" pattern. Case 33 exercises
# boundary discipline under language that invites (but must not produce)
# activation/confirmation wording. Cases 24 and 27 each include a
# distractor observation of a different type so the correct
# supporting_observation_ref target is a genuine test, not the only
# option available.

methodology_note: >
  This file is evaluation data for the Milestone 2 extraction layer only.
  It has no relationship to the CHDM v0.1 Methodology Registry and is not
  loaded or validated by engine/registry_loader.py.

cases:
  - id: "01_clear_customer_objective"
    description: "A single, unambiguous, explicitly stated customer objective."
    source_text: >
      Kickoff notes: the customer's primary goal for this engagement is to
      reduce manual invoice reconciliation time by 50% within two quarters.
    expected_observations:
      - type: OBJECTIVE_CANDIDATE
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "reduce manual invoice reconciliation time by 50% within two quarters"
    must_not_extract:
      - "any Objective Outcome state (Achieved/Progressing/etc.)"
      - "any Value Evidence Basis as a governed final result"

  - id: "02_unknown_absent_objective"
    description: "Notes that never state what the customer is trying to achieve."
    source_text: >
      Weekly sync: attendees were the customer's ops lead and two analysts.
      We reviewed the dashboard together and answered some configuration
      questions. No blockers reported.
    expected_observations:
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "customer's ops lead"
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "two analysts"
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "We reviewed the dashboard together and answered some configuration questions"
      - type: SERVICE_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "No blockers reported"
    missing_information_expected:
      - missing_item: "customer_objective"
        role: primary
    must_not_extract:
      - "a fabricated objective_text to satisfy the schema"

  - id: "03_sponsor_departure"
    description: "A sponsor's departure is reported, with no statement about a replacement."
    source_text: >
      Heads up — Priya, who has been our exec sponsor since the start, is
      leaving the company at the end of the month.
    expected_observations:
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "Priya, who has been our exec sponsor since the start, is leaving the company at the end of the month"
    must_not_extract:
      - "sponsor continuity risk severity or CR-01 activation"
      - "a claim about whether a replacement has or hasn't been named (not stated here)"

  - id: "04_sponsor_departure_no_replacement"
    description: "Spec section 4's own worked example: departure + explicit absence of a replacement."
    source_text: >
      Ana told us Roberto left the company in July. No replacement sponsor
      has been named.
    expected_observations:
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "Roberto left the company in July"
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "No replacement sponsor has been named"
    must_not_extract:
      - "Operational Priority or Evidence Review of any kind"
      - "an inferred conclusion that the relationship is at risk"

  - id: "05_strong_usage"
    description: >
      Clear, explicit evidence of strong direct product usage. Canonical
      type is ADOPTION_OBSERVATION only (Milestone 2B.1 Case 05
      disposition) -- the source text never states a customer goal, only
      usage-growth data, so a model emitting OBJECTIVE_CANDIDATE for this
      fact must score WRONG_TYPE, not be credited via an alternate type.
      The schema currently allows this looseness (ObjectiveCandidate's
      target/timeframe fields are optional) -- documented as a possible
      future ontology concern, not acted on in this revision.
    source_text: >
      Usage report: daily active users grew from 40 to 310 over the
      quarter, and the core reporting workflow is now used by every
      regional team.
    expected_observations:
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "daily active users grew from 40 to 310 over the quarter"
    must_not_extract:
      - "a governed D2 Dimension State (Supported/Mixed/Concerning)"

  - id: "06_high_usage_manual_repository_only"
    description: "High login activity, but the notes describe it as manual, repository-style access rather than active workflow engagement."
    source_text: >
      The account shows high login counts, but our CSM notes that most
      sessions are users manually downloading files from the document
      repository rather than using any of the guided workflows.
    expected_observations:
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "most sessions are users manually downloading files from the document repository rather than using any of the guided workflows"
      - type: SERVICE_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "The account shows high login counts"
      - type: EXPERIENCE_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "our CSM notes that most sessions are users manually downloading files from the document repository rather than using any of the guided workflows"
    must_not_extract:
      - "a governed adoption conclusion (Supported/Mixed/Concerning)"
      - "an automated D2 SUPPORTED qualifier (this is manual activity, not automation)"

  - id: "07_healthy_automated_workflow_low_human_activity"
    description: "Low direct human login activity explained by reliable automation — the D2 safeguard scenario."
    source_text: >
      Direct login activity is low this quarter, but that's expected: the
      integration handles the nightly sync automatically and has run
      without failure for the last 90 days.
    expected_observations:
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "the integration handles the nightly sync automatically and has run without failure for the last 90 days"
          - "the integration handles the nightly sync automatically"
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "Direct login activity is low this quarter"
      - type: SERVICE_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "has run without failure for the last 90 days"
    must_not_extract:
      - "a governed D2 Supported/Concerning conclusion"

  - id: "08_service_failure"
    description: >
      A described service incident, with raw severity language that must
      not be converted to a CHDM severity tier. Two acceptable span
      boundaries are listed (Milestone 2B.1 spec section 8 worked
      example): the live model has been observed choosing either a
      narrower or a wider verbatim span for the same incident: both are
      exact grounded quotes of the same material fact.
    source_text: >
      We had a critical outage on the customer's primary integration
      Tuesday night; it was down for roughly 6 hours before the customer's
      team escalated it to us. Currently resolved.
    expected_observations:
      - type: SERVICE_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "a critical outage on the customer's primary integration"
          - "critical outage on the customer's primary integration Tuesday night; it was down for roughly 6 hours"
    must_not_extract:
      - "activated_severity or any CHDM risk severity tier"
      - "a CR-02 activation determination"

  - id: "09_commercial_decision_active"
    description: "An explicit, current commercial/renewal event."
    source_text: >
      Procurement flagged that the renewal decision is now active — they
      are formally evaluating two competitors ahead of the contract
      end date next quarter.
    expected_observations:
      - type: COMMERCIAL_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "the renewal decision is now active"
      - type: COMMERCIAL_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "evaluating two competitors"
    must_not_extract:
      - "a governed D7 Dimension State"
      - "a churn or renewal probability"

  - id: "10_customer_positive_sentiment"
    description: "An explicit, attributed positive sentiment statement."
    source_text: >
      In the QBR, the VP of Operations said the team has been "extremely
      happy" with the platform this quarter and called out the support
      team by name.
    expected_observations:
      - type: EXPERIENCE_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "extremely happy"
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "the VP of Operations said the team has been \"extremely happy\" with the platform this quarter and called out the support team by name"
    must_not_extract:
      - "a governed D4 Dimension State"

  - id: "11_direct_value_confirmation"
    description: "A direct, measured statement of value realization."
    source_text: >
      Finance confirmed that reconciliation time dropped from 6 hours to
      2.5 hours per week after rollout, matching the original target.
    expected_observations:
      - type: OBJECTIVE_CANDIDATE
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "reconciliation time dropped from 6 hours to 2.5 hours per week after rollout"
          - "reconciliation time dropped from 6 hours to 2.5 hours per week after rollout, matching the original target"
    must_not_extract:
      - "Objective Outcome = Achieved as a governed final result"
      - "Value Evidence Basis assigned as a governed classification"

  - id: "12_contradictory_value_evidence"
    description: >
      Spec section 11's own worked example: two sources conflict on
      whether the objective outcome was achieved. The "b" side was a
      deliberate, reviewed ONTOLOGY_AMBIGUITY accommodation under
      Milestone 2B.1 (dual-typed as ADOPTION_OBSERVATION or
      OBJECTIVE_CANDIDATE). Milestone 2B.2 (OC-01 ontology clarification,
      precedence rule OC-02) resolved this: "Average close time remains
      unchanged from baseline" is an observed operational metric, not a
      stated desired outcome -- it answers "what is the customer doing /
      what happened," not "what is the customer trying to achieve." It is
      evidence relevant to the objective stated in source A, but under
      one-fact-one-primary-type it is canonically ADOPTION_OBSERVATION
      only. A model emitting OBJECTIVE_CANDIDATE for this fact now scores
      WRONG_TYPE, consistent with the Case 05 disposition. This is a
      benchmark correction caused by the approved ontology clarification,
      not a loosening or tightening of scoring for its own sake.
    source_text_a: "The customer confirmed the expected reduction in close time was achieved."
    source_text_b: "Average close time remains unchanged from baseline."
    expected_observations:
      - type: OBJECTIVE_CANDIDATE
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "the expected reduction in close time was achieved"
        source: a
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "Average close time remains unchanged from baseline"
        source: b
    expected_contradiction:
      required: true
      must_not_include:
        - "a resolution of which source is correct"
        - "Disputed"
        - "D1 = Mixed"
        - "a DMEG"
    must_not_extract:
      - "any resolution, averaging, or downgrading of either source"

  - id: "13_strategic_organizational_event"
    description: "An explicit strategic/organizational change at the customer."
    source_text: >
      The customer announced an internal reorg last week that merges the
      operations and finance departments under a single new VP starting
      next month.
    expected_observations:
      - type: STRATEGIC_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "an internal reorg last week that merges the operations and finance departments"
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "single new VP starting next month"
    must_not_extract:
      - "a governed D8A/D8B Dimension State"

  - id: "14_irrelevant_noise_text"
    description: >
      Text with no CHDM-relevant candidate facts at all. The live model
      has been observed grounding two spans here (a named-role birthday
      aside, a rescheduled call) that are real and correctly grounded but
      not Customer-Health relevant -- these are explicitly permitted as
      IRRELEVANT_BUT_GROUNDED (Milestone 2B.1 Case 14 disposition), never
      credited as valid finds and never penalized as unsupported.
    source_text: >
      Called in to a bad connection, rescheduled for Thursday. Also, happy
      early birthday to the account's admin assistant.
    expected_observations: []
    grounded_but_irrelevant_permitted:
      - type: STAKEHOLDER_OBSERVATION
        span_substrings:
          - "account's admin assistant"
      - type: SERVICE_OBSERVATION
        span_substrings:
          - "Called in to a bad connection, rescheduled for Thursday"
    must_not_extract:
      - "any fabricated observation of any type"
    notes: "An empty extraction is the CORRECT primary result here (spec §13); the two irrelevant-but-grounded spans above are a known, permitted exception."

  - id: "15_ambiguous_statement_should_remain_inferred"
    description: "A statement that reasonably suggests something but does not directly state it — must surface only as INFERRED_CANDIDATE, never as EXPLICIT, and never as a governed conclusion."
    source_text: >
      Roberto was our executive sponsor. He left the company last month.
    expected_observations:
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "Roberto was our executive sponsor"
      - type: STAKEHOLDER_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "He left the company last month"
    inferred_candidates_permitted:
      - text: "sponsor continuity may now be unresolved"
        basis: INFERRED_CANDIDATE
    must_not_extract:
      - "'sponsor continuity may now be unresolved' labeled as EXPLICIT"
      - "any governed CR-01 activation or Operational Priority conclusion derived from this inference"

  - id: "16_inferred_objective_not_explicit"
    description: >
      New Milestone 2B.1 case (Objective Evidence: inferable-but-not-
      explicit). The customer never states a goal; repeated questioning
      about a specific process reasonably suggests one, but nothing here
      should surface as an EXPLICIT-basis objective.
    source_text: >
      The customer keeps asking whether we can shave time off their
      monthly close process.
    expected_observations: []
    inferred_candidates_permitted:
      - text: "the customer wants to reduce time spent on the monthly close process"
        basis: INFERRED_CANDIDATE
        type: OBJECTIVE_CANDIDATE
        span_substrings:
          - "The customer keeps asking whether we can shave time off their monthly close process"
    must_not_extract:
      - "an EXPLICIT-basis ObjectiveCandidate stating the customer's goal (never directly stated here)"
      - "a governed Objective Outcome state"

  - id: "17_milestone_completion_value_proxy"
    description: >
      New Milestone 2B.1 case (Value Proxy: milestone completion supports
      Progressing, not full realization). Milestone 2B.2 correction
      (OC-01 ontology clarification, precedence rule OC-03, approved
      "Case 17 disposition"): the original OBJECTIVE_CANDIDATE label was
      itself wrong under the clarified ontology, not just a permissive
      schema gap -- "completed phase 1 of the rollout on schedule; phase
      2 configuration begins next week" describes rollout/project status
      and milestone progression, not a stated desired customer outcome.
      OC-01 explicitly excludes milestone completion from triggering
      ObjectiveCandidate. Canonical type is now STRATEGIC_OBSERVATION,
      aligned with the Case 20 correction.
    source_text: >
      The customer completed phase 1 of the rollout on schedule; phase 2
      configuration begins next week.
    expected_observations:
      - type: STRATEGIC_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "The customer completed phase 1 of the rollout on schedule"
    must_not_extract:
      - "an OBJECTIVE_CANDIDATE for this fact (milestone/phase completion and status, not a stated desired outcome, per OC-01)"
      - "an Objective Outcome = Achieved governed conclusion (this is milestone/phase completion, not full objective realization)"
      - "a Value Evidence Basis governed classification"

  - id: "18_high_usage_value_unproven"
    description: >
      New Milestone 2B.1 case (Adoption vs. Value: usage is high but
      value is explicitly unproven/unconfirmed).
    source_text: >
      Login activity is at an all-time high this month, but the customer
      has not yet confirmed whether it is actually reducing their
      processing time.
    expected_observations:
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "Login activity is at an all-time high this month"
    missing_information_expected:
      - missing_item: "value_confirmation"
        role: supporting
    must_not_extract:
      - "a governed Value Evidence Basis of Measured Operational Evidence (value is explicitly unconfirmed here)"
      - "an Objective Outcome = Achieved conclusion"

  - id: "19_narrow_but_effective_adoption"
    description: >
      New Milestone 2B.1 case (Adoption vs. Value: narrow seat usage that
      is nonetheless deep/effective -- narrow breadth must not
      automatically read as weak adoption).
    source_text: >
      Only two of the twelve licensed seats are active, but those two
      users run the core billing reconciliation workflow every single day
      without issue.
    expected_observations:
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "those two users run the core billing reconciliation workflow every single day without issue"
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: supporting
        span_substrings:
          - "Only two of the twelve licensed seats are active"
    must_not_extract:
      - "a governed D2 Dimension State of Concerning derived from low seat count alone"

  - id: "20_second_contradiction_project_status"
    description: >
      New Milestone 2B.1 case (a second contradiction example, spec
      section 9/section 8's item 9 -- structurally distinct from case 12:
      a project-status conflict rather than a value/outcome conflict).
      Milestone 2B.2 correction (OC-01 ontology clarification, precedence
      rule OC-03): side A's original label of OBJECTIVE_CANDIDATE was
      itself wrong under the clarified ontology, not just a model
      deficiency -- "implementation was completed ahead of schedule"
      never states a desired future outcome; it reports project/status
      fact, exactly like side B. Both sides are canonically
      STRATEGIC_OBSERVATION. A model's earlier OBJECTIVE_CANDIDATE (side
      A) or ADOPTION_OBSERVATION (either side) outputs against this case
      remain genuine wrong-type results under OC-03 -- this relabel is a
      benchmark correction caused by the approved ontology clarification,
      not score manipulation.
    source_text_a: "The customer's onboarding lead said implementation was completed ahead of schedule."
    source_text_b: "Internal tracking shows the implementation project is still open with three tasks outstanding."
    expected_observations:
      - type: STRATEGIC_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "implementation was completed ahead of schedule"
        source: a
      - type: STRATEGIC_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "the implementation project is still open with three tasks outstanding"
        source: b
    expected_contradiction:
      required: true
      must_not_include:
        - "a resolution of which source is correct"
        - "Disputed"
        - "D1 = Mixed"
        - "a DMEG"
    must_not_extract:
      - "any resolution, averaging, or downgrading of either source"

  - id: "21_inferred_objective_from_support_pattern"
    description: >
      New Milestone 2B.2 case (OC-01 validation: inferred-but-not-explicit
      objective, distinct scenario from case 16 -- here the signal is a
      repeated support-ticket pattern rather than a single direct
      question). The explicit fact is the ticket pattern itself
      (SERVICE_OBSERVATION); the underlying desire for CRM integration is
      never directly stated and must surface only as
      INFERRED_CANDIDATE, never as an EXPLICIT-basis ObjectiveCandidate.
    source_text: "Over the last quarter, the customer has opened four support tickets asking whether their CRM data can be connected to our platform automatically."
    expected_observations:
      - type: SERVICE_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "the customer has opened four support tickets asking whether their CRM data can be connected to our platform automatically"
    inferred_candidates_permitted:
      - text: "the customer wants their CRM data connected to the platform automatically"
        basis: INFERRED_CANDIDATE
        type: OBJECTIVE_CANDIDATE
        span_substrings:
          - "Over the last quarter, the customer has opened four support tickets asking whether their CRM data can be connected to our platform automatically"
    must_not_extract:
      - "an EXPLICIT-basis ObjectiveCandidate stating a CRM-integration goal (never directly stated here)"
      - "a governed Objective Outcome state"

  - id: "22_pure_strategic_no_usage_language"
