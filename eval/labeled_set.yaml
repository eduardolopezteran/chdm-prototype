        basis: EXPLICIT
        role: primary
        span_substrings:
          - "continues to run their month-end close workflow in the platform exactly as designed, with no reported issues this quarter"
    expected_dimension_d2_qualifiers:
      - qualifier: "INTENDED_WORKFLOWS_OPERATING_NORMALLY"
        role: primary
        supporting_observation_span_substrings:
          - "continues to run their month-end close workflow in the platform exactly as designed, with no reported issues this quarter"
    expected_dimension_d6_qualifiers: []

  - id: "35_d2_qualifier_automation_reliable_low_login_ok"
    description: >
      Milestone 4B D2 qualifier coverage case 2 of 5. Low direct login
      activity that is explicitly explained by reliable automation --
      must not be force-fit into WORKFLOWS_NOT_OCCURRING or
      ADOPTION_MATERIALLY_DETERIORATING_UNEXPLAINED just because login
      counts are low. NORMALIZED (D2 EXPLICIT-basis composition gate
      checkpoint, benchmark audit): this case's two facts -- automation
      reliability, and low login explained by that automation -- are
      stated in two separate clauses of one semicolon-joined sentence.
      Stage-1 correctly and consistently extracts these as TWO separate
      AdoptionObservations under the isolated one-observation-per-call
      architecture, and neither observation alone states all 3 required
      D2 atomic predicates: the reliability clause never states a
      login/activity level, and the login clause states no reliability
      track record (only automation mode, e.g. "without manual
      intervention," which the v3.2 calibration correctly no longer
      treats as reliability evidence). AUTOMATION_RELIABLE_LOW_LOGIN_OK
      is therefore correctly NOT expected to compose here. This
      benchmark previously expected composition from the reliability
      observation alone -- an expectation authored before the v3 atomic-
      predicate architecture existed, which became structurally
      unsatisfiable once cross-observation synthesis was deliberately
      excluded by design (never a defect). Both individual atomic facts
      remain true and are preserved below as optional-valid
      observations; this case now exercises correct compound non-force-
      fit abstention, mirroring case 07's existing precedent for the
      identical split-clause pattern (case 07 has never expected this
      compound to compose).
    source_text: "The nightly data sync between the customer's ERP and our platform has run automatically without failure for the past six months; direct user logins remain low, which is expected since the integration handles the workflow without manual intervention."
    expected_observations:
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: primary
        span_substrings:
          - "The nightly data sync between the customer's ERP and our platform has run automatically without failure for the past six months"
      - type: ADOPTION_OBSERVATION
        basis: EXPLICIT
        role: optional-valid
        span_substrings:
          - "direct user logins remain low, which is expected since the integration handles the workflow without manual intervention"
    expected_dimension_d2_qualifiers: []
    expected_dimension_d6_qualifiers: []

