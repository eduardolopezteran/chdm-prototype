  # ---------------------------------------------------------------------
  # Milestone 4B — D2/D6 Candidate Qualifier Extraction (resolves
  # M3-OD-01). Cases 34-42 exercise the SEPARATE stage-2 classifier
  # (extraction.pipeline.run_dimension_qualifier_classification), never
  # run_extraction() itself -- `expected_dimension_d2_qualifiers` /
  # `expected_dimension_d6_qualifiers` are scored by
  # eval.metrics.classify_dimension_qualifiers against the stage-2
  # output, via eval/run_eval.py's two-stage per-case flow. Each entry:
  # `qualifier` (the exact D2/D6 vocabulary value), `role`
  # (primary|supporting|optional-valid, defaults to primary),
  # `supporting_observation_span_substrings` (must match a real
  # expected_observations entry in the SAME case -- exactly the same
  # discipline as expected_candidate_risk_signals/expected_candidate_
  # evidence_classifications above). Cases 34-38 cover the 5 D2
  # qualifiers; 39-41 cover the 4 D6 qualifiers (case 40 specifically
  # targets the CHAMPION_LOST_NO_SUCCESSOR vs CHAMPION_DEPARTURE_
  # UNCONFIRMED distinction flagged as the trickiest pair during
  # architecture negotiation); case 42 is a co-occurrence case (one D2 +
  # one D6 qualifier from the same evidence batch) that also probes
  # non-force-fit behavior (a third, unremarkable adoption observation
  # that must receive NO D2 qualifier proposal).
  # ---------------------------------------------------------------------

  - id: "34_d2_qualifier_intended_workflows_operating_normally"
    description: >
      Milestone 4B D2 qualifier coverage case 1 of 5. Ordinary, on-track
      adoption -- the intended workflow is operating normally, with no
